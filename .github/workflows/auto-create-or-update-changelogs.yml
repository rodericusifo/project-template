name: Auto Create or Update Changelogs

on:
  push:
    branches:
      - prod-v1
    paths:
      - 'workload/**/VERSION'  # Only trigger when VERSION files are changed

# Prevent multiple instances from running simultaneously
concurrency:
  group: auto-changelog-${{ github.ref }}
  cancel-in-progress: false  # Don't cancel running jobs, just queue them

permissions:
  contents: write  # Required to commit changelog changes
  actions: read    # Required to access workflow information

jobs:
  create-or-update-changelogs:
    name: Create or Update Changelogs
    runs-on: ubuntu-latest
    # Skip workflow for auto-generated commits to prevent infinite loops
    if: |
      !contains(github.event.head_commit.message, '[auto-changelog]') &&
      !contains(github.event.head_commit.message, 'Auto-update changelog') &&
      !contains(github.event.head_commit.message, '[skip-changelog]')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch full history to compare versions
        token: ${{ secrets.BYPASS_PAT || secrets.GITHUB_TOKEN }}
    
    - name: Configure git user
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
    
    - name: Setup GitHub CLI
      env:
        GH_TOKEN: ${{ secrets.BYPASS_PAT || secrets.GITHUB_TOKEN }}
      run: |
        # Use GH_TOKEN to authenticate gh non-interactively; avoids piping secrets
        gh auth status --hostname github.com
    
    - name: Create changelogs for version changes
      run: |
        set -e
        
        # Colors for output
        RED='\033[0;31m'
        GREEN='\033[0;32m'
        YELLOW='\033[1;33m'
        BLUE='\033[0;34m'
        NC='\033[0m'
        
        print_error() { echo -e "${RED}ERROR: $1${NC}" >&2; }
        print_success() { echo -e "${GREEN}SUCCESS: $1${NC}"; }
        print_warning() { echo -e "${YELLOW}WARNING: $1${NC}"; }
        print_info() { echo -e "${BLUE}INFO: $1${NC}"; }

        # Check if a file matches any pattern in the given service's .dockerignore
        # (e.g. *.cnf, *.env, *.key) - such files are excluded from the built image
        # and shouldn't count as workload changes needing a changelog entry.
        matches_dockerignore() {
            local service="$1" fname="$2" dockerignore_file="workload/$1/.dockerignore"
            [ -f "$dockerignore_file" ] || return 1
            while IFS= read -r pattern; do
                pattern="${pattern%%#*}"
                pattern="$(echo "$pattern" | xargs)"
                [ -z "$pattern" ] && continue
                [[ "$fname" == $pattern ]] && return 0
            done < "$dockerignore_file"
            return 1
        }

        # Base URL for linking commit hashes in changelog entries back to GitHub
        repo_url="${{ github.server_url }}/${{ github.repository }}"

        print_info "Checking for workload changes in pushed commits..."
        
        # Skip if this is an auto-generated changelog commit to prevent infinite loops
        commit_message=$(git log -1 --pretty=format:"%s")
        if [[ "$commit_message" == *"Auto-update changelog"* ]] || [[ "$commit_message" == *"[auto-changelog]"* ]]; then
            print_info "Skipping changelog generation for auto-generated commit: $commit_message"
            exit 0
        fi
        
        # Get list of commits that were just pushed
        # Use GitHub context to get the exact range of commits pushed
        if [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            # Normal push: compare with the previous state
            before_commit="${{ github.event.before }}"
            after_commit="${{ github.event.after }}"
            
            # Check if both commits exist and are valid
            if git rev-parse --verify "$before_commit" >/dev/null 2>&1 && git rev-parse --verify "$after_commit" >/dev/null 2>&1; then
                # Try to get the commit range
                if commits_being_pushed=$(git rev-list "$before_commit..$after_commit" 2>/dev/null); then
                    print_info "Processing push from $before_commit to $after_commit"
                else
                    print_warning "Invalid revision range, falling back to single commit analysis"
                    commits_being_pushed=$(git rev-list -n 1 "$after_commit")
                    before_commit=""  # Clear before_commit to indicate fallback mode
                fi
            else
                print_warning "Before or after commit not found, analyzing current HEAD only"
                commits_being_pushed=$(git rev-list -n 1 HEAD)
                before_commit=""  # Clear before_commit to indicate fallback mode
            fi
        else
            # First push or force push: get all commits in the current push
            commits_being_pushed=$(git rev-list HEAD)
            before_commit=""  # No before commit available
            print_info "Processing initial or force push (all commits)"
        fi
        
        if [ -z "$commits_being_pushed" ]; then
            print_info "No new commits to process. No changelogs to create."
            exit 0
        fi
        
        print_info "Found pushed commits: $(echo "$commits_being_pushed" | wc -l) commits"
        
        # Check for workload changes in the commits being pushed (same as pre-push logic)
        workloads=()
        
        # Collect all workloads that have changes (excluding certain files)
        while IFS= read -r commit; do
            files_changed=$(git diff-tree --no-commit-id --name-only -r "$commit")
            while IFS= read -r file; do
                if [[ $file == workload/* ]]; then
                    workload_name=$(echo $file | cut -d'/' -f2)
                    
                    # Extract the file name from the path
                    filename=$(basename "$file")
                    
                    # Skip files that shouldn't trigger changelog generation
                    if [[ "$filename" == "CHANGELOG.md" ]] || \
                       [[ "$filename" == "Makefile" ]] || \
                       [[ "$filename" == "docker-compose.yaml" ]] || \
                       [[ "$filename" == ".dockerignore" ]] || \
                       matches_dockerignore "$workload_name" "$filename"; then
                        print_info "Skipping file (excluded from changelog trigger): $file"
                        continue
                    fi
                    
                    # Add workload to array if not already present
                    if [[ ! " ${workloads[@]} " =~ " ${workload_name} " ]]; then
                        workloads+=("$workload_name")
                        print_info "Found changes in workload: $workload_name"
                    fi
                fi
            done <<< "$files_changed"
        done <<< "$commits_being_pushed"
        
        # Also check for all workloads that need changelogs (new workloads without CHANGELOG.md)
        print_info "Checking for workloads that need initial changelogs..."
        for workload_dir in workload/*/; do
            if [ -d "$workload_dir" ]; then
                workload_name=$(basename "$workload_dir")
                # Skip non-workload directories
                if [[ "$workload_name" == "Makefile" ]] || [[ "$workload_name" == "gen-certs.sh" ]]; then
                    continue
                fi
                
                version_file="$workload_dir/VERSION"
                changelog_file="$workload_dir/CHANGELOG.md"
                
                # If workload has VERSION but no CHANGELOG, it needs a changelog
                if [ -f "$version_file" ] && [ ! -f "$changelog_file" ]; then
                    if [[ ! " ${workloads[@]} " =~ " ${workload_name} " ]]; then
                        workloads+=("$workload_name")
                        print_info "Found workload needing initial changelog: $workload_name"
                    fi
                fi
            fi
        done
        
        if [ ${#workloads[@]} -eq 0 ]; then
            print_info "No workloads modified and no workloads need initial changelogs."
            exit 0
        fi
        
        print_info "Workloads with changes: ${workloads[*]}"
        
        # When merging to prod-v1, always process all workloads with changes
        # The version should have been incremented during the merge process
        workloads_to_process=()
        
        for workload in "${workloads[@]}"; do
            version_file="workload/$workload/VERSION"
            
            if [ ! -f "$version_file" ]; then
                print_warning "VERSION file not found for workload $workload. Skipping changelog generation."
                continue
            fi
            
            current_version=$(cat "$version_file" | tr -d '\n\r' | tr -d ' ')
            
            # Get version from the before commit (what was in prod-v1 before this merge)
            before_version=""
            if [ -n "$before_commit" ] && git show "$before_commit":"$version_file" &>/dev/null; then
                before_version=$(git show "$before_commit":"$version_file" | tr -d '\n\r' | tr -d ' ')
            else
                if [ -z "$before_commit" ]; then
                    print_warning "No before commit available (force push or first push). Using base branch for comparison."
                    # Try to get version from origin/prod-v1 as fallback
                    if git show origin/prod-v1:"$version_file" &>/dev/null; then
                        before_version=$(git show origin/prod-v1:"$version_file" | tr -d '\n\r' | tr -d ' ')
                    else
                        before_version="0.0.0"
                    fi
                else
                    print_warning "VERSION file for $workload not found in before commit. Treating as new workload."
                    before_version="0.0.0"
                fi
            fi
            
            print_info "Workload: $workload | Before: $before_version | Current: $current_version"
            
            # Always process workloads with changes when merging to prod-v1
            # The assumption is that versions are always incremented during merge
            workloads_to_process+=("$workload")
            if [ "$current_version" != "$before_version" ]; then
                print_info "Version changed for $workload: $before_version -> $current_version"
            else
                print_info "Processing $workload (version unchanged but workload has code changes)"
            fi
        done
        
        if [ ${#workloads_to_process[@]} -eq 0 ]; then
            print_info "No workloads to process. No changelogs to create."
            exit 0
        fi
        
        print_info "Workloads to process for changelog: ${workloads_to_process[*]}"
        
        # Create/update changelogs for all workloads with changes
        changelogs_created=()
        changelogs_updated=()
        
        for workload in "${workloads_to_process[@]}"; do
            version_file="workload/$workload/VERSION"
            changelog_file="workload/$workload/CHANGELOG.md"
            
            current_version=$(cat "$version_file" | tr -d '\n\r' | tr -d ' ')
            
            print_info "=== CHANGELOG GENERATION ==="
            print_info "Processing changelog for $workload version $current_version..."
            
            # Get previous version from before commit for comparison
            previous_version=""
            if [ -n "$before_commit" ] && git show "$before_commit":"$version_file" &>/dev/null; then
                previous_version=$(git show "$before_commit":"$version_file" | tr -d '\n\r' | tr -d ' ')
            else
                # Fallback to base branch or default
                if git show origin/prod-v1:"$version_file" &>/dev/null; then
                    previous_version=$(git show origin/prod-v1:"$version_file" | tr -d '\n\r' | tr -d ' ')
                else
                    previous_version="0.0.0"
                fi
            fi
            
            # Get commits that were just pushed for this specific workload
            commits_for_workload=""
            
            # Use the commits that were pushed in this merge
            while IFS= read -r commit; do
                if [ -n "$commit" ]; then
                    files_in_commit=$(git diff-tree --no-commit-id --name-only -r "$commit")
                    
                    # Check if this commit modified this workload (excluding certain files)
                    workload_modified=false
                    while IFS= read -r file; do
                        if [[ $file == workload/$workload/* ]]; then
                            # Extract the file name from the path
                            filename=$(basename "$file")
                            
                            # Skip files that shouldn't count as workload changes
                            if [[ "$filename" == "CHANGELOG.md" ]] || \
                               [[ "$filename" == "Makefile" ]] || \
                               [[ "$filename" == "docker-compose.yaml" ]] || \
                               [[ "$filename" == ".dockerignore" ]] || \
                               matches_dockerignore "$workload" "$filename"; then
                                continue
                            fi
                            
                            workload_modified=true
                            break
                        fi
                    done <<< "$files_in_commit"
                    
                    if [ "$workload_modified" = true ]; then
                        # Skip auto-generated changelog commits
                        commit_msg=$(git log --format="%s" -n 1 "$commit")
                        if [[ ! $commit_msg =~ ^docs\($workload\):.*Changelog\ for\ Version ]] && [[ ! $commit_msg == *"Auto-update changelog"* ]]; then
                            commit_line=$(git log --oneline -n 1 "$commit")
                            if [ -n "$commits_for_workload" ]; then
                                commits_for_workload="${commits_for_workload}"$'\n'"$commit_line"
                            else
                                commits_for_workload="$commit_line"
                            fi
                        fi
                    fi
                fi
            done <<< "$commits_being_pushed"
            
            # For new workloads without CHANGELOG.md, create initial changelog even without specific commits
            changelog_file="workload/$workload/CHANGELOG.md"
            if [ ! -f "$changelog_file" ]; then
                if [ -z "$commits_for_workload" ]; then
                    # Use the overall push commit for initial changelog
                    commits_for_workload=$(git log --oneline -n 1 HEAD)
                    print_info "Creating initial changelog for new workload $workload using latest commit"
                fi
            elif [ -z "$commits_for_workload" ]; then
                print_warning "No relevant commits found for existing workload $workload in this push"
                continue
            fi
            
            # Idempotency guard: skip if this version is already recorded, so a
            # re-triggered/re-run workflow (or a push that forgot to bump VERSION)
            # doesn't insert a duplicate "## [version]" heading
            if [ -f "$changelog_file" ] && grep -q "^## \[${current_version}\]" "$changelog_file"; then
                print_warning "Version ${current_version} already recorded in changelog for $workload. Skipping duplicate entry."
                continue
            fi

            # Generate changelog entry
            changelog_entry="## [${current_version}] - $(date -u +'%Y-%m-%d %H:%M:%S %Z')

        ### Changes

        "
            
            while IFS= read -r commit_line; do
                if [ -n "$commit_line" ]; then
                    commit_hash=$(echo "$commit_line" | cut -d' ' -f1)
                    commit_msg=$(echo "$commit_line" | cut -d' ' -f2-)
                    changelog_entry="${changelog_entry}- ${commit_msg} ([${commit_hash}](${repo_url}/commit/${commit_hash}))
        "
                fi
            done <<< "$commits_for_workload"
            
            # Determine if this is a new workload or existing workload
            # New workload: Only VERSION file exists (no CHANGELOG.md)
            # Existing workload: Both VERSION and CHANGELOG.md files exist
            
            if [ ! -f "$changelog_file" ]; then
                # New Workload - Create new changelog with initiation info
                print_info "New workload detected (only VERSION file exists) - Creating new changelog for $workload"
                
                # Create initial changelog structure using echo commands
                {
                    echo "# Changelog - $workload"
                    echo ""
                    echo "All notable changes to the $workload will be documented in this file."
                    echo ""
                    echo "The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),"
                    echo "and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html)."
                    echo ""
                    echo "## [${current_version}] - $(date -u +'%Y-%m-%d %H:%M:%S %Z')"
                    echo ""
                    echo "### Changes"
                    echo ""

                    # Add commits from this push
                    while IFS= read -r commit_line; do
                        if [ -n "$commit_line" ]; then
                            commit_hash=$(echo "$commit_line" | cut -d' ' -f1)
                            commit_msg=$(echo "$commit_line" | cut -d' ' -f2-)
                            echo "- ${commit_msg} ([${commit_hash}](${repo_url}/commit/${commit_hash}))"
                        fi
                    done <<< "$commits_for_workload"
                    
                    echo ""
                } > "$changelog_file"
                
                changelogs_created+=("$workload")
                print_success "Created new changelog for $workload with workload initiation and current changes"
            else
                # Existing Workload - Update existing changelog
                print_info "Existing workload detected (both VERSION and CHANGELOG.md exist) - Updating changelog for $workload"
                
                # Create temporary file for merging
                temp_file=$(mktemp)
                
                # Read existing changelog and insert new entry right before first version section
                awk -v new_entry="$changelog_entry" '
                /^##/ && !inserted {
                    print new_entry
                    inserted = 1
                }
                { print }
                END {
                    if (!inserted) {
                        print ""
                        print new_entry
                    }
                }
                ' "$changelog_file" > "$temp_file"
                
                # Replace original with updated version
                mv "$temp_file" "$changelog_file"
                changelogs_updated+=("$workload")
                print_success "Updated existing changelog for $workload"
            fi
        done
        
        # Commit changes if any changelogs were created/updated
        total_changes=$((${#changelogs_created[@]} + ${#changelogs_updated[@]}))
        
        if [ $total_changes -gt 0 ]; then
            git add workload/*/CHANGELOG.md
            
            # Create commit message
            if [ ${#changelogs_created[@]} -gt 0 ] && [ ${#changelogs_updated[@]} -gt 0 ]; then
                commit_msg="Auto-update changelog: Created ${#changelogs_created[@]}, Updated ${#changelogs_updated[@]} [auto-changelog]"
            elif [ ${#changelogs_created[@]} -gt 0 ]; then
                commit_msg="Auto-update changelog: Created ${#changelogs_created[@]} changelog(s) [auto-changelog]"
            else
                commit_msg="Auto-update changelog: Updated ${#changelogs_updated[@]} changelog(s) [auto-changelog]"
            fi
            
            git commit -m "$commit_msg"
            
            # Push directly to prod-v1 using bypass token
            git push origin prod-v1
            
            print_success "Committed and pushed changelog changes directly to prod-v1 (bypassing protection)"
        fi
        
        # Create summary for GitHub Actions
        echo "## 📝 Auto Changelog Creation Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ ${#changelogs_created[@]} -gt 0 ]; then
            echo "### 🆕 New Changelogs Created:" >> $GITHUB_STEP_SUMMARY
            for workload in "${changelogs_created[@]}"; do
                version=$(cat "workload/$workload/VERSION" | tr -d '\n\r' | tr -d ' ')
                echo "- **$workload** v$version" >> $GITHUB_STEP_SUMMARY
            done
            echo "" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [ ${#changelogs_updated[@]} -gt 0 ]; then
            echo "### 🔄 Changelogs Updated:" >> $GITHUB_STEP_SUMMARY
            for workload in "${changelogs_updated[@]}"; do
                version=$(cat "workload/$workload/VERSION" | tr -d '\n\r' | tr -d ' ')
                echo "- **$workload** v$version" >> $GITHUB_STEP_SUMMARY
            done
            echo "" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "**Summary:** Created ${#changelogs_created[@]} new changelogs, updated ${#changelogs_updated[@]} existing changelogs" >> $GITHUB_STEP_SUMMARY
        echo "**Trigger:** Automatic on workload changes with version updates pushed to prod-v1" >> $GITHUB_STEP_SUMMARY
        
        if [ $total_changes -gt 0 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### ✅ Completed Actions:" >> $GITHUB_STEP_SUMMARY
            echo "- Changelog changes committed and pushed directly to prod-v1" >> $GITHUB_STEP_SUMMARY
            echo "- Branch protection rules bypassed using elevated token" >> $GITHUB_STEP_SUMMARY
            echo "- The auto-create-tags workflow will now run automatically" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [ $total_changes -gt 0 ]; then
            print_success "Successfully processed $total_changes changelog(s)"
        else
            print_info "No changelogs needed to be created or updated"
        fi
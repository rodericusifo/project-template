name: Auto Lint

on:
  workflow_call:
    inputs:
      workloads:
        description: Comma-separated workload directories to lint
        required: true
        type: string
      workflow-configs:
        description: JSON array of language and marker configuration objects
        required: true
        type: string

jobs:
  golang:
    name: Lint Go Workloads
    if: contains(inputs.workflow-configs, '"language":"golang"')
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
        cache: false

    - name: Install golangci-lint
      run: |
        curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v1.61.0/install.sh \
          | sh -s -- -b "$RUNNER_TEMP/bin" v1.61.0
        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

    - name: Run Go lint
      env:
        WORKLOADS: ${{ inputs.workloads }}
        WORKFLOW_CONFIGS: ${{ inputs.workflow-configs }}
      run: |
        set -euo pipefail

        marker=$(jq -r '.[] | select(.language == "golang") | .marker' <<< "$WORKFLOW_CONFIGS")
        if [ -z "$marker" ] || [ "$marker" = "null" ]; then
          echo "::error::No marker configured for the golang lint job"
          exit 1
        fi

        IFS=',' read -ra workloads <<< "$WORKLOADS"
        matched=false
        for workload in "${workloads[@]}"; do
          if [ ! -f "workload/$workload/$marker" ]; then
            continue
          fi
          matched=true
          echo "Linting workload/$workload"
          (cd "workload/$workload" && golangci-lint run ./...)
        done

        if [ "$matched" = false ]; then
          echo "No Go workloads matched marker: $marker"
        fi

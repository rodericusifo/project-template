services:
  instance-0:
    container_name: ${WORKLOAD}_${ENV}
    tty: true
    build:
      dockerfile: Dockerfile
      context: .
      args:
        MODE: development
    image: ${SLUG}/${WORKLOAD}:${VERSION}
    environment:
      - ENV=${ENV}
    volumes:
      - ./env:/env
      - ./certs:/certs
    ports:
      - 7071:${SERVER_PORT:-7070}
    restart: on-failure
    networks:
      backend:
        aliases:
          - ${WORKLOAD}
    healthcheck:
      test: ["CMD", "nc", "-zv", "localhost", "${SERVER_PORT:-7070}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  backend:
    external: true
    name: ${SLUG}_${ENV}